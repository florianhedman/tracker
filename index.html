<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <meta name="description" content="Personal workout tracker with programs, plans, history and progress charts." />

  <title>Workout Tracker</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'DM Mono', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    input, button, select, textarea { font-family: inherit; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    ::-webkit-scrollbar { width: 0; background: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect } = React;


// ─── Persistent Storage ────────────────────────────────────────────────────────
const STORAGE_KEY = "workout-tracker-data";
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

// ─── Exercise Library ──────────────────────────────────────────────────────────
const WEIGHT_EXERCISES = [
  "Bench Press","Squat","Deadlift","Overhead Press","Barbell Row",
  "Pull-up","Dumbbell Curl","Tricep Pushdown","Lat Pulldown",
  "Leg Press","Romanian Deadlift","Incline Bench Press","Cable Fly",
  "Dumbbell Row","Face Pull","Lateral Raise","Front Raise",
];
const BODYWEIGHT_EXERCISES = [
  "Push-up","Pull-up","Dip","Chin-up","Muscle-up",
  "Handstand Push-up","Pistol Squat","L-Sit","Planche Lean",
  "Ring Row","Dragon Flag","Ab Wheel Rollout","Hollow Body Hold",
  "Archer Push-up","Nordic Curl","Jump Squat",
];
const ALL_EXERCISES = [...WEIGHT_EXERCISES, ...BODYWEIGHT_EXERCISES];
const BODYWEIGHT_SET = new Set(BODYWEIGHT_EXERCISES);
// isBW checks both built-in and custom bodyweight exercises
// customBW is passed at call sites; for global built-in check we use this:
const isBW = (name, customBW) => BODYWEIGHT_SET.has(name) || (customBW||[]).includes(name);

// ─── Utils ─────────────────────────────────────────────────────────────────────
const today = () => new Date().toISOString().split("T")[0];
const fmtDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" });
const uid = () => Math.random().toString(36).slice(2, 9);

// ─── Icon ──────────────────────────────────────────────────────────────────────
const Icon = ({ d, size = 20 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
    <path d={d} />
  </svg>
);
const IC = {
  plus:      "M12 5v14M5 12h14",
  trash:     "M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6",
  check:     "M20 6L9 17l-5-5",
  history:   "M12 8v4l3 3M3.05 11a9 9 0 1 0 .5-3M3 4v4h4",
  chart:     "M3 3v18h18M7 16l4-4 4 4 4-4",
  dumbbell:  "M6.5 6.5h11M6.5 17.5h11M3 9h3v6H3zM18 9h3v6h-3zM6 6v12M18 6v12",
  close:     "M18 6L6 18M6 6l12 12",
  plan:      "M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 12h6M9 16h4",
  play:      "M5 3l14 9-14 9V3z",
  edit:      "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
  repeat:    "M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3",
  star:      "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
};

// ─── Styles ────────────────────────────────────────────────────────────────────
const S = {
  app: {
    minHeight:"100vh", background:"#0a0a0a", color:"#f0f0f0",
    fontFamily:"'DM Mono','Courier New',monospace", maxWidth:480,
    margin:"0 auto", position:"relative",
  },
  header: {
    padding:"20px 20px 16px", borderBottom:"1px solid #1e1e1e",
    display:"flex", alignItems:"center", justifyContent:"space-between",
    position:"sticky", top:0, background:"#0a0a0a", zIndex:10,
  },
  title: { fontSize:22, fontWeight:700, letterSpacing:"-0.5px", color:"#fff" },
  accent: { color:"#c8ff00" },
  nav: {
    position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
    width:"100%", maxWidth:480, background:"#111", borderTop:"1px solid #222",
    display:"flex", zIndex:100,
  },
  navBtn: (active) => ({
    flex:1, padding:"12px 0 10px", display:"flex", flexDirection:"column",
    alignItems:"center", gap:3, fontSize:10, fontFamily:"'DM Mono',monospace",
    letterSpacing:"0.5px", textTransform:"uppercase", border:"none",
    background:"none", color:active?"#c8ff00":"#555", cursor:"pointer",
    transition:"color 0.15s", WebkitTapHighlightColor:"transparent",
  }),
  card: {
    background:"#141414", border:"1px solid #222", borderRadius:2,
    margin:"0 16px 12px", padding:16,
  },
  btn: (variant="primary") => ({
    background: variant==="primary"?"#c8ff00":variant==="danger"?"#ff3b30":variant==="accent"?"#1a2600":"#1e1e1e",
    color: variant==="primary"?"#000":variant==="accent"?"#c8ff00":"#fff",
    border: variant==="accent"?"1px solid #c8ff00":"none",
    borderRadius:2, padding:"12px 20px", fontSize:14,
    fontFamily:"'DM Mono',monospace", fontWeight:700, letterSpacing:"0.5px",
    cursor:"pointer", textTransform:"uppercase", display:"flex",
    alignItems:"center", gap:6, transition:"opacity 0.15s", whiteSpace:"nowrap",
    WebkitTapHighlightColor:"transparent",
  }),
  input: {
    background:"#0e0e0e", border:"1px solid #2a2a2a", borderRadius:2,
    color:"#f0f0f0", fontFamily:"'DM Mono',monospace", fontSize:14,
    padding:"10px 12px", width:"100%", boxSizing:"border-box", outline:"none",
  },
  label: {
    fontSize:10, color:"#666", textTransform:"uppercase",
    letterSpacing:"1px", display:"block", marginBottom:4,
  },
  tag: (active) => ({
    padding:"6px 12px", border:`1px solid ${active?"#c8ff00":"#333"}`,
    borderRadius:2, background:active?"#c8ff00":"transparent",
    color:active?"#000":"#999", fontSize:12, fontFamily:"'DM Mono',monospace",
    cursor:"pointer", whiteSpace:"nowrap", transition:"all 0.15s",
    WebkitTapHighlightColor:"transparent",
  }),
};

// ─── Exercise Picker Modal ─────────────────────────────────────────────────────
function ExercisePicker({ onSelect, onClose, customExercises, multiSelect, selected = [] }) {
  const [search, setSearch] = useState("");
  const [tab, setTab] = useState("all");
  const custom = customExercises || [];
  const cats = { all:[...ALL_EXERCISES,...custom], weight:WEIGHT_EXERCISES, bodyweight:BODYWEIGHT_EXERCISES, custom };
  const filtered = (cats[tab]||[]).filter(e => e.toLowerCase().includes(search.toLowerCase()));

  return (
    <div style={{
      position:"fixed", top:0, left:0, right:0, bottom:0, background:"rgba(0,0,0,0.95)", zIndex:200,
      display:"flex", flexDirection:"column", maxWidth:480, margin:"0 auto",
    }}>
      <div style={{ padding:"16px 16px 0", borderBottom:"1px solid #222" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
          <span style={{ fontWeight:700, fontSize:15 }}>
            {multiSelect ? `Select Exercises${selected.length > 0 ? ` (${selected.length})` : ""}` : "Pick Exercise"}
          </span>
          <button onClick={onClose} style={{ background:"none", border:"none", color:"#888", cursor:"pointer", padding:4 }}>
            <Icon d={IC.close} size={20} />
          </button>
        </div>
        <input autoFocus placeholder="Search..." value={search}
          onChange={e => setSearch(e.target.value)} style={{ ...S.input, marginBottom:12 }} />
        <div style={{ display:"flex", gap:8, overflowX:"auto", paddingBottom:12 }}>
          {[["all","All"],["weight","Weights"],["bodyweight","Bodyweight"],["custom","Custom"]].map(([k,l]) => (
            <button key={k} onClick={() => setTab(k)} style={S.tag(tab===k)}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:"8px 0" }}>
        {filtered.length===0 && <div style={{ color:"#555", textAlign:"center", padding:32 }}>No exercises found</div>}
        {filtered.map(name => {
          const isSelected = selected.includes(name);
          return (
            <button key={name} onClick={() => onSelect(name)} style={{
              display:"flex", alignItems:"center", justifyContent:"space-between",
              width:"100%", textAlign:"left", background:isSelected?"#0e1a00":"none",
              border:"none", borderBottom:"1px solid #1a1a1a",
              color:isSelected?"#c8ff00":"#f0f0f0", fontFamily:"'DM Mono',monospace",
              fontSize:14, padding:"14px 20px", cursor:"pointer",
              WebkitTapHighlightColor:"transparent",
            }}>
              {name}
              {isSelected && <Icon d={IC.check} size={16} />}
            </button>
          );
        })}
      </div>
      {multiSelect && (
        <div style={{ padding:16, borderTop:"1px solid #222" }}>
          <button onClick={onClose} style={{ ...S.btn("primary"), width:"100%", justifyContent:"center" }}>
            Done ({selected.length} selected)
          </button>
        </div>
      )}
    </div>
  );
}

// ─── Set Row ───────────────────────────────────────────────────────────────────
function SetRow({ set, index, bw, onChange, onRemove }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
      <span style={{ color:"#444", fontSize:12, width:18, textAlign:"center", flexShrink:0 }}>{index+1}</span>
      {!bw && (
        <input type="number" placeholder="kg" value={set.weight||""} inputMode="decimal"
          onChange={e => onChange({ ...set, weight:e.target.value })}
          style={{ ...S.input, textAlign:"center", flex:1 }} />
      )}
      <input type="number" placeholder="reps" value={set.reps||""} inputMode="numeric"
        onChange={e => onChange({ ...set, reps:e.target.value })}
        style={{ ...S.input, textAlign:"center", flex:1 }} />
      <button onClick={onRemove} style={{ ...S.btn("danger"), padding:"9px 10px", flexShrink:0 }}>
        <Icon d={IC.trash} size={13} />
      </button>
    </div>
  );
}

// ─── Exercise Block ────────────────────────────────────────────────────────────
function ExerciseBlock({ ex, onUpdate, onRemove, prevBest, customBW }) {
  const bw = isBW(ex.name, customBW);
  const addSet = () => onUpdate({ ...ex, sets:[...ex.sets, { id:uid(), weight:"", reps:"" }] });
  const removeSet = (id) => onUpdate({ ...ex, sets:ex.sets.filter(s => s.id!==id) });
  const updateSet = (id, d) => onUpdate({ ...ex, sets:ex.sets.map(s => s.id===id ? d : s) });

  return (
    <div style={S.card}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12 }}>
        <div>
          <div style={{ fontWeight:700, fontSize:15, color:"#fff" }}>{ex.name}</div>
          {prevBest && <div style={{ fontSize:11, color:"#555", marginTop:2 }}>prev best: {prevBest}</div>}
        </div>
        <button onClick={onRemove} style={{ background:"none", border:"none", color:"#444", cursor:"pointer", padding:4 }}>
          <Icon d={IC.close} size={16} />
        </button>
      </div>
      <div style={{ display:"flex", gap:8, marginBottom:8 }}>
        {!bw && <div style={{ flex:1, fontSize:10, color:"#555", textAlign:"center", textTransform:"uppercase", letterSpacing:1 }}>KG</div>}
        <div style={{ flex:1, fontSize:10, color:"#555", textAlign:"center", textTransform:"uppercase", letterSpacing:1 }}>REPS</div>
        <div style={{ width:38 }} />
      </div>
      {ex.sets.map((set, i) => (
        <SetRow key={set.id} set={set} index={i} bw={bw}
          onChange={d => updateSet(set.id, d)}
          onRemove={() => removeSet(set.id)} />
      ))}
      <button onClick={addSet} style={{ ...S.btn("ghost"), width:"100%", justifyContent:"center", marginTop:4, padding:"9px" }}>
        <Icon d={IC.plus} size={14} /> Add Set
      </button>
    </div>
  );
}

// ─── LOG VIEW ──────────────────────────────────────────────────────────────────
// ─── Add Custom Exercise Modal ─────────────────────────────────────────────────
function AddCustomModal({ onAdd, onClose }) {
  const [name, setName] = useState("");
  const [isBWCustom, setIsBWCustom] = useState(false);
  const submit = () => {
    if (!name.trim()) return;
    onAdd(name.trim(), isBWCustom);
    onClose();
  };
  return (
    <div style={{ position:"fixed", top:0, left:0, right:0, bottom:0, background:"rgba(0,0,0,0.92)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
      <div style={{ background:"#141414", border:"1px solid #333", borderRadius:2, padding:24, width:"100%", maxWidth:360 }}>
        <div style={{ fontWeight:700, fontSize:15, marginBottom:4 }}>New Custom Exercise</div>
        <div style={{ fontSize:11, color:"#555", marginBottom:16 }}>Saved to your library permanently</div>
        <label style={S.label}>Exercise Name</label>
        <input autoFocus value={name} onChange={e => setName(e.target.value)}
          onKeyDown={e => e.key==="Enter" && submit()}
          placeholder="e.g. Zercher Squat" style={{ ...S.input, marginBottom:14 }} />
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:20, cursor:"pointer" }}
          onClick={() => setIsBWCustom(b => !b)}>
          <div style={{
            width:18, height:18, border:`1px solid ${isBWCustom?"#c8ff00":"#444"}`,
            borderRadius:2, background:isBWCustom?"#c8ff00":"transparent",
            display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0,
          }}>
            {isBWCustom && <span style={{ fontSize:11, color:"#000", fontWeight:700 }}>✓</span>}
          </div>
          <span style={{ fontSize:12, color:"#999" }}>Bodyweight (no weight field)</span>
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <button onClick={submit} disabled={!name.trim()}
            style={{ ...S.btn("primary"), flex:1, justifyContent:"center", opacity:name.trim()?1:0.4 }}>
            Add to Library
          </button>
          <button onClick={onClose} style={{ ...S.btn("ghost"), flex:1, justifyContent:"center" }}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

function LogView({ data, setData, loadedPlan, clearLoadedPlan }) {
  const [session, setSession] = useState({ date:today(), exercises:[], note:"" });
  const [showPicker, setShowPicker] = useState(false);
  const [showCustom, setShowCustom] = useState(false);
  const [saved, setSaved] = useState(false);

  const addCustomExercise = (name, isBWCustom) => {
    const custom = data.customExercises || [];
    if (custom.includes(name)) return;
    const newData = { ...data, customExercises:[...custom, name], customBW:[...(data.customBW||[]), ...(isBWCustom?[name]:[]) ] };
    setData(newData);
    saveData(newData);
    // also immediately add to session
    setSession(s => ({ ...s, exercises:[...s.exercises, { id:uid(), name, sets:[{ id:uid(), weight:"", reps:"" }] }] }));
  };

  useEffect(() => {
    if (loadedPlan) {
      setSession({
        date: today(),
        planName: loadedPlan.planName,
        programId: loadedPlan.programId,
        dayIndex: loadedPlan.dayIndex,
        exercises: loadedPlan.exercises.map(name => ({
          id:uid(), name, sets:[{ id:uid(), weight:"", reps:"" }]
        })),
        note: "",
      });
      clearLoadedPlan();
    }
  }, [loadedPlan]);

  const addExercise = (name) => {
    setSession(s => ({ ...s, exercises:[...s.exercises, { id:uid(), name, sets:[{ id:uid(), weight:"", reps:"" }] }] }));
    setShowPicker(false);
  };
  const updateEx = (id, updated) => setSession(s => ({ ...s, exercises:s.exercises.map(e => e.id===id ? updated : e) }));
  const removeEx = (id) => setSession(s => ({ ...s, exercises:s.exercises.filter(e => e.id!==id) }));

  const getPrevBest = (name) => {
    for (const w of [...data.workouts].reverse()) {
      const found = w.exercises.find(e => e.name===name);
      if (!found) continue;
      const valid = found.sets.filter(s => s.reps);
      if (!valid.length) continue;
      if (isBW(name, data.customBW)) return `${Math.max(...valid.map(s => Number(s.reps)))} reps`;
      const best = valid.reduce((b,s) => (Number(s.weight)*Number(s.reps)) > (Number(b.weight)*Number(b.reps)) ? s : b);
      return `${best.weight}kg × ${best.reps}`;
    }
    return null;
  };

  const saveSession = () => {
    if (!session.exercises.length) return;
    let newData = { ...data, workouts:[...data.workouts, { ...session, id:uid() }] };
    // Auto-advance program day counter
    if (session.programId != null) {
      newData = {
        ...newData,
        programs: (newData.programs||[]).map(p => {
          if (p.id !== session.programId) return p;
          const nextDay = (session.dayIndex + 1) % p.days.length;
          return { ...p, currentDay: nextDay };
        }),
      };
    }
    setData(newData);
    saveData(newData);
    setSaved(true);
    setTimeout(() => { setSaved(false); setSession({ date:today(), exercises:[], note:"" }); }, 1500);
  };

  const totalSets = session.exercises.reduce((n,e) => n + e.sets.filter(s => s.reps).length, 0);

  return (
    <div style={{ paddingBottom:80 }}>
      {showPicker && (
        <ExercisePicker onSelect={addExercise} onClose={() => setShowPicker(false)} customExercises={data.customExercises} />
      )}
      {showCustom && (
        <AddCustomModal onAdd={addCustomExercise} onClose={() => setShowCustom(false)} />
      )}
      <div style={S.header}>
        <div>
          <div style={S.title}>Today's <span style={S.accent}>Session</span></div>
          <div style={{ fontSize:11, color:session.planName?"#c8ff00":"#555", marginTop:2 }}>
            {session.planName ? `📋 ${session.planName}` : fmtDate(session.date)}
          </div>
        </div>
        {totalSets > 0 && (
          <div style={{ textAlign:"right" }}>
            <div style={{ fontSize:20, fontWeight:700, color:"#c8ff00" }}>{totalSets}</div>
            <div style={{ fontSize:10, color:"#555", textTransform:"uppercase" }}>sets done</div>
          </div>
        )}
      </div>

      <div style={{ marginTop:16 }}>
        {session.exercises.map(ex => (
          <ExerciseBlock key={ex.id} ex={ex}
            onUpdate={u => updateEx(ex.id, u)}
            onRemove={() => removeEx(ex.id)}
            prevBest={getPrevBest(ex.name)}
            customBW={data.customBW} />
        ))}
      </div>

      <div style={{ padding:"0 16px", marginBottom:12, display:"flex", gap:8 }}>
        <button onClick={() => setShowPicker(true)} style={{ ...S.btn("ghost"), flex:1, justifyContent:"center" }}>
          <Icon d={IC.plus} size={16} /> Add Exercise
        </button>
        <button onClick={() => setShowCustom(true)} title="Create custom exercise"
          style={{ ...S.btn("ghost"), padding:"12px 14px", flexShrink:0 }}>
          <Icon d={IC.star} size={16} />
        </button>
      </div>

      {session.exercises.length > 0 && (
        <div style={{ padding:"0 16px" }}>
          <div style={{ marginBottom:12 }}>
            <label style={S.label}>Session Note (optional)</label>
            <input placeholder="How did it feel?" value={session.note}
              onChange={e => setSession(s => ({ ...s, note:e.target.value }))} style={S.input} />
          </div>
          <button onClick={saveSession}
            style={{ ...S.btn("primary"), width:"100%", justifyContent:"center", fontSize:15, padding:14 }}>
            {saved ? <><Icon d={IC.check} size={16} /> Saved!</> : "Save Session"}
          </button>
        </div>
      )}

      {session.exercises.length === 0 && (
        <div style={{ textAlign:"center", padding:"60px 32px" }}>
          <div style={{ fontSize:48, marginBottom:12 }}>💪</div>
          <div style={{ fontSize:14, color:"#444", lineHeight:1.8 }}>
            Tap "Add Exercise" to start,<br />or load a program from the <span style={{ color:"#c8ff00" }}>Plans</span> tab
          </div>
        </div>
      )}
    </div>
  );
}

// ─── PLANS VIEW (shell with sub-tabs) ──────────────────────────────────────────
function PlansView({ data, setData, onLoadPlan }) {
  const [subTab, setSubTab] = useState("programs");
  const [programView, setProgramView] = useState("list");
  const [planView, setPlanView] = useState("list");

  return (
    <div style={{ paddingBottom:80 }}>
      <div style={S.header}>
        <div style={S.title}>
          {subTab === "programs"
            ? <>My <span style={S.accent}>Programs</span></>
            : <>Single <span style={S.accent}>Plans</span></>}
        </div>
      </div>

      <div style={{ display:"flex", gap:0, margin:"16px 16px 0", border:"1px solid #222", borderRadius:2, overflow:"hidden" }}>
        {[["programs","Programs","Multi-day"],["plans","Plans","Single day"]].map(([k, label, sub]) => (
          <button key={k} onClick={() => setSubTab(k)} style={{
            flex:1, padding:"10px 8px",
            background:subTab===k?"#c8ff00":"transparent",
            color:subTab===k?"#000":"#555",
            border:"none", fontFamily:"'DM Mono',monospace",
            fontWeight:700, fontSize:12, letterSpacing:"0.5px", textTransform:"uppercase",
            cursor:"pointer", transition:"all 0.15s", WebkitTapHighlightColor:"transparent",
          }}>
            <div>{label}</div>
            <div style={{ fontSize:9, fontWeight:400, opacity:0.7, marginTop:1 }}>{sub}</div>
          </button>
        ))}
      </div>

      {subTab === "programs"
        ? <ProgramsSubView data={data} setData={setData} onLoadPlan={onLoadPlan} view={programView} setView={setProgramView} />
        : <SinglePlansSubView data={data} setData={setData} onLoadPlan={onLoadPlan} view={planView} setView={setPlanView} />
      }
    </div>
  );
}

// ─── PROGRAMS SUB-VIEW ─────────────────────────────────────────────────────────
function ProgramsSubView({ data, setData, onLoadPlan, view, setView }) {
  const [editingProgram, setEditingProgram] = useState(null);
  const [progName, setProgName] = useState("");
  const [days, setDays] = useState([]);
  const [activeDayIdx, setActiveDayIdx] = useState(0);
  const [showPicker, setShowPicker] = useState(false);
  const [confirmLoad, setConfirmLoad] = useState(null);
  const [deleting, setDeleting] = useState(null);

  const programs = data.programs || [];

  const startNew = () => {
    setEditingProgram(null); setProgName("");
    setDays([{ id:uid(), label:"Day 1", exercises:[] }]);
    setActiveDayIdx(0); setView("edit");
  };

  const startEdit = (prog) => {
    setEditingProgram(prog); setProgName(prog.name);
    setDays(prog.days.map(d => ({ ...d, exercises:[...d.exercises] })));
    setActiveDayIdx(0); setView("edit");
  };

  const addDay = () => {
    const nd = { id:uid(), label:`Day ${days.length + 1}`, exercises:[] };
    setDays(d => [...d, nd]);
    setActiveDayIdx(days.length);
  };

  const removeDay = (idx) => {
    if (days.length <= 1) return;
    const nd = days.filter((_, i) => i !== idx);
    setDays(nd);
    setActiveDayIdx(Math.min(activeDayIdx, nd.length - 1));
  };

  const updateDayLabel = (idx, label) =>
    setDays(ds => ds.map((d, i) => i === idx ? { ...d, label } : d));

  const toggleExercise = (name) =>
    setDays(ds => ds.map((d, i) => {
      if (i !== activeDayIdx) return d;
      const exs = d.exercises.includes(name)
        ? d.exercises.filter(e => e !== name)
        : [...d.exercises, name];
      return { ...d, exercises: exs };
    }));

  const moveExercise = (dayIdx, exIdx, dir) =>
    setDays(ds => ds.map((d, i) => {
      if (i !== dayIdx) return d;
      const arr = [...d.exercises];
      const t = exIdx + dir;
      if (t < 0 || t >= arr.length) return d;
      [arr[exIdx], arr[t]] = [arr[t], arr[exIdx]];
      return { ...d, exercises: arr };
    }));

  const removeExercise = (dayIdx, name) =>
    setDays(ds => ds.map((d, i) => i === dayIdx ? { ...d, exercises:d.exercises.filter(e => e !== name) } : d));

  const saveProgram = () => {
    if (!progName.trim() || days.some(d => d.exercises.length === 0)) return;
    const newPrograms = editingProgram
      ? programs.map(p => p.id===editingProgram.id ? { ...p, name:progName.trim(), days } : p)
      : [...programs, { id:uid(), name:progName.trim(), days, currentDay:0 }];
    const newData = { ...data, programs:newPrograms };
    setData(newData); saveData(newData); setView("list");
  };

  const deleteProgram = (id) => {
    const newData = { ...data, programs:programs.filter(p => p.id!==id) };
    setData(newData); saveData(newData); setDeleting(null);
  };

  const jumpToDay = (progId, dayIdx) => {
    const newData = { ...data, programs:programs.map(p => p.id===progId ? { ...p, currentDay:dayIdx } : p) };
    setData(newData); saveData(newData);
  };

  const resetDay = async (progId) => jumpToDay(progId, 0);

  // ── Edit Screen ──
  if (view === "edit") {
    const activeDay = days[activeDayIdx];
    return (
      <div style={{ paddingBottom:80 }}>
        {showPicker && (
          <ExercisePicker onSelect={toggleExercise} onClose={() => setShowPicker(false)}
            customExercises={data.customExercises} multiSelect selected={(activeDay && activeDay.exercises) || []} />
        )}

        <div style={{ padding:"16px 16px 0" }}>
          <label style={S.label}>Program Name</label>
          <input placeholder='"PPL", "Push/Pull/Legs", "5-Day Split"...'
            value={progName} onChange={e => setProgName(e.target.value)}
            style={{ ...S.input, marginBottom:20, fontSize:16 }} />
        </div>

        {/* Day tabs row */}
        <div style={{ padding:"0 16px 0" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <label style={{ ...S.label, marginBottom:0 }}>Days ({days.length})</label>
            <button onClick={addDay} style={{ ...S.btn("accent"), padding:"5px 10px", fontSize:11 }}>
              <Icon d={IC.plus} size={12} /> Add Day
            </button>
          </div>
          <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:12 }}>
            {days.map((d, i) => (
              <button key={d.id} onClick={() => setActiveDayIdx(i)} style={{
                ...S.tag(activeDayIdx === i),
                position:"relative",
                paddingRight: days.length > 1 ? 26 : 12,
                flexShrink:0,
              }}>
                {d.label}
                {days.length > 1 && (
                  <span onClick={e => { e.stopPropagation(); removeDay(i); }}
                    style={{ position:"absolute", right:7, top:"50%", transform:"translateY(-50%)", fontSize:10, opacity:0.5, lineHeight:1 }}>✕</span>
                )}
              </button>
            ))}
          </div>
        </div>

        {/* Active day editor */}
        {activeDay && (
          <div style={{ padding:"0 16px" }}>
            <div style={{ display:"flex", gap:8, marginBottom:14, alignItems:"center" }}>
              <input value={activeDay.label} onChange={e => updateDayLabel(activeDayIdx, e.target.value)}
                style={{ ...S.input, flex:1 }} placeholder="Day label" />
              <button onClick={() => setShowPicker(true)} style={{ ...S.btn("accent"), padding:"10px 14px", flexShrink:0 }}>
                <Icon d={IC.plus} size={14} /> Add
              </button>
            </div>

            {activeDay.exercises.length === 0 ? (
              <div style={{ textAlign:"center", padding:"24px 0", color:"#444", fontSize:13 }}>
                Tap Add to pick exercises for this day
              </div>
            ) : (
              activeDay.exercises.map((name, i) => (
                <div key={name} style={{
                  display:"flex", alignItems:"center", gap:8, padding:"10px 12px",
                  background:"#141414", border:"1px solid #222", borderRadius:2, marginBottom:6,
                }}>
                  <div style={{ display:"flex", flexDirection:"column", gap:1 }}>
                    <button onClick={() => moveExercise(activeDayIdx, i, -1)} disabled={i===0}
                      style={{ background:"none", border:"none", color:i===0?"#2a2a2a":"#666", cursor:i===0?"default":"pointer", padding:"1px 6px", fontSize:11, lineHeight:1.2 }}>▲</button>
                    <button onClick={() => moveExercise(activeDayIdx, i, 1)} disabled={i===activeDay.exercises.length-1}
                      style={{ background:"none", border:"none", color:i===activeDay.exercises.length-1?"#2a2a2a":"#666", cursor:i===activeDay.exercises.length-1?"default":"pointer", padding:"1px 6px", fontSize:11, lineHeight:1.2 }}>▼</button>
                  </div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:14, color:"#f0f0f0" }}>{name}</div>
                    <div style={{ fontSize:10, color:"#555", marginTop:1 }}>{isBW(name, data.customBW) ? "Bodyweight" : "Weighted"}</div>
                  </div>
                  <button onClick={() => removeExercise(activeDayIdx, name)}
                    style={{ background:"none", border:"none", color:"#555", cursor:"pointer", padding:4 }}>
                    <Icon d={IC.close} size={16} />
                  </button>
                </div>
              ))
            )}
          </div>
        )}

        <div style={{ padding:"16px" }}>
          {days.some(d => d.exercises.length === 0) && (
            <div style={{ fontSize:11, color:"#ff3b30", marginBottom:8, textAlign:"center" }}>
              ⚠ All days need at least 1 exercise
            </div>
          )}
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={() => setView("list")} style={{ ...S.btn("ghost"), flex:1, justifyContent:"center" }}>Cancel</button>
            <button onClick={saveProgram}
              disabled={!progName.trim() || days.some(d => d.exercises.length === 0)}
              style={{
                ...S.btn("primary"), flex:2, justifyContent:"center", fontSize:15, padding:14,
                opacity:(!progName.trim() || days.some(d => d.exercises.length === 0)) ? 0.4 : 1,
              }}>
              <Icon d={IC.check} size={16} /> {editingProgram ? "Save Changes" : "Create Program"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── List Screen ──
  return (
    <div>
      {confirmLoad && (
        <div style={{ position:"fixed", top:0, left:0, right:0, bottom:0, background:"rgba(0,0,0,0.88)", zIndex:150, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
          <div style={{ background:"#141414", border:"1px solid #333", borderRadius:2, padding:24, width:"100%", maxWidth:320 }}>
            <div style={{ fontWeight:700, fontSize:15, marginBottom:4 }}>Start {confirmLoad.prog.name}?</div>
            <div style={{ fontSize:14, color:"#c8ff00", fontWeight:700, marginBottom:4 }}>{confirmLoad.day.label}</div>
            <div style={{ fontSize:12, color:"#666", marginBottom:20 }}>{confirmLoad.day.exercises.length} exercises will be pre-loaded</div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={() => {
                onLoadPlan({
                  planName: `${confirmLoad.prog.name} — ${confirmLoad.day.label}`,
                  programId: confirmLoad.prog.id,
                  dayIndex: confirmLoad.dayIdx,
                  exercises: confirmLoad.day.exercises,
                });
                setConfirmLoad(null);
              }} style={{ ...S.btn("primary"), flex:1, justifyContent:"center" }}>
                <Icon d={IC.play} size={14} /> Let's go
              </button>
              <button onClick={() => setConfirmLoad(null)} style={{ ...S.btn("ghost"), flex:1, justifyContent:"center" }}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      <div style={{ marginTop:16 }}>
        {programs.length === 0 ? (
          <div style={{ textAlign:"center", padding:"48px 32px" }}>
            <div style={{ fontSize:48, marginBottom:12 }}>🗓️</div>
            <div style={{ fontSize:14, color:"#444", lineHeight:1.8 }}>
              No programs yet.<br />Build a multi-day program to cycle<br />through Day 1, Day 2, Day 3 automatically.
            </div>
            <button onClick={startNew} style={{ ...S.btn("accent"), margin:"20px auto 0", justifyContent:"center" }}>
              <Icon d={IC.plus} size={16} /> Create First Program
            </button>
          </div>
        ) : (
          <>
            {programs.map(prog => {
              const curIdx = prog.currentDay || 0;
              const currentDay = prog.days[curIdx];
              return (
                <div key={prog.id} style={S.card}>
                  {/* Header */}
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14 }}>
                    <div>
                      <div style={{ fontWeight:700, fontSize:16, color:"#fff" }}>{prog.name}</div>
                      <div style={{ fontSize:11, color:"#555", marginTop:2 }}>{prog.days.length}-day program</div>
                    </div>
                    <div style={{ display:"flex", gap:6 }}>
                      <button onClick={() => startEdit(prog)} style={{ background:"none", border:"none", color:"#555", cursor:"pointer", padding:4 }}>
                        <Icon d={IC.edit} size={16} />
                      </button>
                      <button onClick={() => setDeleting(prog.id)} style={{ background:"none", border:"none", color:"#555", cursor:"pointer", padding:4 }}>
                        <Icon d={IC.trash} size={16} />
                      </button>
                    </div>
                  </div>

                  {/* Day selector panel */}
                  <div style={{ background:"#0e0e0e", border:"1px solid #1e1e1e", borderRadius:2, padding:"12px 14px", marginBottom:14 }}>
                    <div style={{ fontSize:10, color:"#555", textTransform:"uppercase", letterSpacing:1, marginBottom:8 }}>Select day to run</div>
                    <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:10 }}>
                      {prog.days.map((d, i) => (
                        <button key={d.id} onClick={() => jumpToDay(prog.id, i)} style={{
                          flexShrink:0, padding:"6px 12px",
                          border:`1px solid ${curIdx===i ? "#c8ff00" : "#2a2a2a"}`,
                          borderRadius:2,
                          background:curIdx===i ? "#1a2600" : "transparent",
                          color:curIdx===i ? "#c8ff00" : "#555",
                          fontSize:11, fontFamily:"'DM Mono',monospace",
                          cursor:"pointer", whiteSpace:"nowrap",
                          fontWeight: curIdx===i ? 700 : 400,
                          WebkitTapHighlightColor:"transparent",
                        }}>
                          {d.label}
                        </button>
                      ))}
                    </div>

                    {/* Current day details */}
                    <div style={{ borderTop:"1px solid #1e1e1e", paddingTop:10, marginTop:2 }}>
                      <div style={{ fontWeight:700, color:"#fff", fontSize:13, marginBottom:6 }}>{currentDay.label}</div>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>
                        {currentDay.exercises.map(name => (
                          <span key={name} style={{
                            fontSize:10, color:"#777", background:"#1a1a1a",
                            border:"1px solid #2a2a2a", borderRadius:2, padding:"2px 7px",
                          }}>{name}</span>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Actions */}
                  {deleting === prog.id ? (
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <span style={{ fontSize:12, color:"#ff3b30" }}>Delete program?</span>
                      <button onClick={() => deleteProgram(prog.id)} style={{ ...S.btn("danger"), padding:"6px 12px", fontSize:12 }}>Yes</button>
                      <button onClick={() => setDeleting(null)} style={{ ...S.btn("ghost"), padding:"6px 12px", fontSize:12 }}>No</button>
                    </div>
                  ) : (
                    <div style={{ display:"flex", gap:8 }}>
                      <button onClick={() => setConfirmLoad({ prog, day:currentDay, dayIdx:curIdx })}
                        style={{ ...S.btn("accent"), flex:1, justifyContent:"center" }}>
                        <Icon d={IC.play} size={15} /> Start {currentDay.label}
                      </button>
                      <button onClick={() => resetDay(prog.id)} title="Reset to Day 1"
                        style={{ ...S.btn("ghost"), padding:"12px 14px" }}>
                        <Icon d={IC.repeat} size={15} />
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
            <div style={{ padding:"0 16px 8px" }}>
              <button onClick={startNew} style={{ ...S.btn("ghost"), width:"100%", justifyContent:"center" }}>
                <Icon d={IC.plus} size={16} /> New Program
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ─── Custom Exercises Manager ──────────────────────────────────────────────────
function CustomExercisesManager({ data, setData }) {
  const [showAdd, setShowAdd] = useState(false);
  const [deletingEx, setDeletingEx] = useState(null);
  const custom = data.customExercises || [];

  const addCustom = (name, isBWCustom) => {
    if (custom.includes(name)) return;
    const newData = {
      ...data,
      customExercises: [...custom, name],
      customBW: [...(data.customBW||[]), ...(isBWCustom ? [name] : [])],
    };
    setData(newData); saveData(newData);
  };

  const deleteCustom = (name) => {
    const newData = {
      ...data,
      customExercises: custom.filter(e => e !== name),
      customBW: (data.customBW||[]).filter(e => e !== name),
    };
    setData(newData); saveData(newData); setDeletingEx(null);
  };

  return (
    <div style={{ marginTop:8, paddingBottom:16 }}>
      {showAdd && <AddCustomModal onAdd={addCustom} onClose={() => setShowAdd(false)} />}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 20px 8px" }}>
        <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:"1.5px" }}>
          Custom Exercises ({custom.length})
        </div>
        <button onClick={() => setShowAdd(true)} style={{ ...S.btn("accent"), padding:"5px 10px", fontSize:11 }}>
          <Icon d={IC.plus} size={12} /> New
        </button>
      </div>
      {custom.length === 0 ? (
        <div style={{ textAlign:"center", padding:"16px 32px", color:"#333", fontSize:12 }}>
          No custom exercises yet. Tap New to add one.
        </div>
      ) : (
        <div style={{ padding:"0 16px" }}>
          {custom.map(name => (
            <div key={name} style={{
              display:"flex", alignItems:"center", gap:8, padding:"10px 12px",
              background:"#0e0e0e", border:"1px solid #1e1e1e", borderRadius:2, marginBottom:6,
            }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:13, color:"#ddd" }}>{name}</div>
                <div style={{ fontSize:10, color:"#555", marginTop:1 }}>
                  {isBW(name, data.customBW) ? "Bodyweight" : "Weighted"} · Custom
                </div>
              </div>
              {deletingEx === name ? (
                <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                  <span style={{ fontSize:11, color:"#ff3b30" }}>Delete?</span>
                  <button onClick={() => deleteCustom(name)} style={{ ...S.btn("danger"), padding:"4px 8px", fontSize:11 }}>Yes</button>
                  <button onClick={() => setDeletingEx(null)} style={{ ...S.btn("ghost"), padding:"4px 8px", fontSize:11 }}>No</button>
                </div>
              ) : (
                <button onClick={() => setDeletingEx(name)}
                  style={{ background:"none", border:"none", color:"#444", cursor:"pointer", padding:4 }}>
                  <Icon d={IC.trash} size={15} />
                </button>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── SINGLE PLANS SUB-VIEW ─────────────────────────────────────────────────────
function SinglePlansSubView({ data, setData, onLoadPlan, view, setView }) {
  const [editingPlan, setEditingPlan] = useState(null);
  const [showPicker, setShowPicker] = useState(false);
  const [planName, setPlanName] = useState("");
  const [selectedExercises, setSelectedExercises] = useState([]);
  const [confirmLoad, setConfirmLoad] = useState(null);
  const [deleting, setDeleting] = useState(null);

  const plans = data.plans || [];

  const startNew = () => { setEditingPlan(null); setPlanName(""); setSelectedExercises([]); setView("edit"); };
  const startEdit = (plan) => { setEditingPlan(plan); setPlanName(plan.name); setSelectedExercises([...plan.exercises]); setView("edit"); };

  const toggleExercise = (name) =>
    setSelectedExercises(prev => prev.includes(name) ? prev.filter(e => e!==name) : [...prev, name]);

  const savePlan = () => {
    if (!planName.trim() || selectedExercises.length === 0) return;
    const newPlans = editingPlan
      ? plans.map(p => p.id===editingPlan.id ? { ...p, name:planName.trim(), exercises:selectedExercises } : p)
      : [...plans, { id:uid(), name:planName.trim(), exercises:selectedExercises }];
    const newData = { ...data, plans:newPlans };
    setData(newData); saveData(newData); setView("list");
  };

  const deletePlan = (id) => {
    const newData = { ...data, plans:plans.filter(p => p.id!==id) };
    setData(newData); saveData(newData); setDeleting(null);
  };

  const moveEx = (index, dir) => {
    const arr = [...selectedExercises];
    const t = index + dir;
    if (t < 0 || t >= arr.length) return;
    [arr[index], arr[t]] = [arr[t], arr[index]];
    setSelectedExercises(arr);
  };

  if (view === "edit") {
    return (
      <div style={{ paddingBottom:80 }}>
        {showPicker && (
          <ExercisePicker onSelect={toggleExercise} onClose={() => setShowPicker(false)}
            customExercises={data.customExercises} multiSelect selected={selectedExercises} />
        )}
        <div style={{ padding:"16px 16px 0" }}>
          <label style={S.label}>Plan Name</label>
          <input placeholder='"Push Day", "Upper Body", "Legs + Core"'
            value={planName} onChange={e => setPlanName(e.target.value)}
            style={{ ...S.input, marginBottom:20, fontSize:16 }} />
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <label style={{ ...S.label, marginBottom:0 }}>Exercises ({selectedExercises.length})</label>
            <button onClick={() => setShowPicker(true)} style={{ ...S.btn("accent"), padding:"6px 12px", fontSize:12 }}>
              <Icon d={IC.plus} size={14} /> Add
            </button>
          </div>
        </div>

        {selectedExercises.length === 0 ? (
          <div style={{ textAlign:"center", padding:"32px", color:"#444", fontSize:13 }}>Tap Add to pick exercises</div>
        ) : (
          <div style={{ padding:"0 16px" }}>
            {selectedExercises.map((name, i) => (
              <div key={name} style={{
                display:"flex", alignItems:"center", gap:8, padding:"10px 12px",
                background:"#141414", border:"1px solid #222", borderRadius:2, marginBottom:6,
              }}>
                <div style={{ display:"flex", flexDirection:"column", gap:1 }}>
                  <button onClick={() => moveEx(i, -1)} disabled={i===0}
                    style={{ background:"none", border:"none", color:i===0?"#2a2a2a":"#666", cursor:i===0?"default":"pointer", padding:"1px 6px", fontSize:11, lineHeight:1.2 }}>▲</button>
                  <button onClick={() => moveEx(i, 1)} disabled={i===selectedExercises.length-1}
                    style={{ background:"none", border:"none", color:i===selectedExercises.length-1?"#2a2a2a":"#666", cursor:i===selectedExercises.length-1?"default":"pointer", padding:"1px 6px", fontSize:11, lineHeight:1.2 }}>▼</button>
                </div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:14, color:"#f0f0f0" }}>{name}</div>
                  <div style={{ fontSize:10, color:"#555", marginTop:1 }}>{isBW(name, data.customBW) ? "Bodyweight" : "Weighted"}</div>
                </div>
                <button onClick={() => setSelectedExercises(prev => prev.filter(e => e!==name))}
                  style={{ background:"none", border:"none", color:"#555", cursor:"pointer", padding:4 }}>
                  <Icon d={IC.close} size={16} />
                </button>
              </div>
            ))}
          </div>
        )}

        <div style={{ padding:"16px" }}>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={() => setView("list")} style={{ ...S.btn("ghost"), flex:1, justifyContent:"center" }}>Cancel</button>
            <button onClick={savePlan}
              disabled={!planName.trim() || selectedExercises.length === 0}
              style={{
                ...S.btn("primary"), flex:2, justifyContent:"center", fontSize:15, padding:14,
                opacity:(!planName.trim() || selectedExercises.length === 0) ? 0.4 : 1,
              }}>
              <Icon d={IC.check} size={16} /> {editingPlan ? "Save Changes" : "Create Plan"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      {confirmLoad && (
        <div style={{ position:"fixed", top:0, left:0, right:0, bottom:0, background:"rgba(0,0,0,0.88)", zIndex:150, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
          <div style={{ background:"#141414", border:"1px solid #333", borderRadius:2, padding:24, width:"100%", maxWidth:320 }}>
            <div style={{ fontWeight:700, fontSize:15, marginBottom:6 }}>Start "{confirmLoad.name}"?</div>
            <div style={{ fontSize:13, color:"#666", marginBottom:20 }}>{confirmLoad.exercises.length} exercises will be pre-loaded.</div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={() => { onLoadPlan({ planName:confirmLoad.name, exercises:confirmLoad.exercises }); setConfirmLoad(null); }}
                style={{ ...S.btn("primary"), flex:1, justifyContent:"center" }}>
                <Icon d={IC.play} size={14} /> Let's go
              </button>
              <button onClick={() => setConfirmLoad(null)} style={{ ...S.btn("ghost"), flex:1, justifyContent:"center" }}>Cancel</button>
            </div>
          </div>
        </div>
      )}
      <div style={{ marginTop:16 }}>
        {plans.length === 0 ? (
          <div style={{ textAlign:"center", padding:"48px 32px" }}>
            <div style={{ fontSize:48, marginBottom:12 }}>📋</div>
            <div style={{ fontSize:14, color:"#444", lineHeight:1.8 }}>No single-day plans yet.</div>
            <button onClick={startNew} style={{ ...S.btn("accent"), margin:"20px auto 0", justifyContent:"center" }}>
              <Icon d={IC.plus} size={16} /> Create First Plan
            </button>
          </div>
          <CustomExercisesManager data={data} setData={setData} />
        ) : (
          <>
            {plans.map(plan => (
              <div key={plan.id} style={S.card}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:12 }}>
                  <div>
                    <div style={{ fontWeight:700, fontSize:16, color:"#fff" }}>{plan.name}</div>
                    <div style={{ fontSize:12, color:"#555", marginTop:3 }}>{plan.exercises.length} exercises</div>
                  </div>
                  <div style={{ display:"flex", gap:6 }}>
                    <button onClick={() => startEdit(plan)} style={{ background:"none", border:"none", color:"#555", cursor:"pointer", padding:4 }}>
                      <Icon d={IC.edit} size={16} />
                    </button>
                    <button onClick={() => setDeleting(plan.id)} style={{ background:"none", border:"none", color:"#555", cursor:"pointer", padding:4 }}>
                      <Icon d={IC.trash} size={16} />
                    </button>
                  </div>
                </div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:14 }}>
                  {plan.exercises.map(name => (
                    <span key={name} style={{ fontSize:11, color:"#777", background:"#1a1a1a", border:"1px solid #2a2a2a", borderRadius:2, padding:"3px 8px" }}>{name}</span>
                  ))}
                </div>
                {deleting === plan.id ? (
                  <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                    <span style={{ fontSize:12, color:"#ff3b30" }}>Delete this plan?</span>
                    <button onClick={() => deletePlan(plan.id)} style={{ ...S.btn("danger"), padding:"6px 12px", fontSize:12 }}>Yes</button>
                    <button onClick={() => setDeleting(null)} style={{ ...S.btn("ghost"), padding:"6px 12px", fontSize:12 }}>No</button>
                  </div>
                ) : (
                  <button onClick={() => setConfirmLoad(plan)} style={{ ...S.btn("accent"), width:"100%", justifyContent:"center" }}>
                    <Icon d={IC.play} size={15} /> Start This Plan
                  </button>
                )}
              </div>
            ))}
            <div style={{ padding:"0 16px 8px" }}>
              <button onClick={startNew} style={{ ...S.btn("ghost"), width:"100%", justifyContent:"center" }}>
                <Icon d={IC.plus} size={16} /> New Plan
              </button>
            </div>
          </>
        )}
      </div>

      {/* ── Custom Exercise Library ── */}
      <CustomExercisesManager data={data} setData={setData} />
    </div>
  );
}

// ─── HISTORY VIEW ──────────────────────────────────────────────────────────────
function HistoryView({ data, setData }) {
  const [expanded, setExpanded] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const sorted = [...data.workouts].reverse();

  const deleteWorkout = (id) => {
    const newData = { ...data, workouts:data.workouts.filter(w => w.id!==id) };
    setData(newData); saveData(newData); setDeleting(null);
  };

  if (!sorted.length) return (
    <div style={{ textAlign:"center", padding:"80px 32px", color:"#444", paddingBottom:80 }}>
      <div style={{ fontSize:48, marginBottom:12 }}>📋</div>
      <div>No sessions yet. Log your first workout!</div>
    </div>
  );

  return (
    <div style={{ paddingBottom:80 }}>
      <div style={S.header}>
        <div style={S.title}>Workout <span style={S.accent}>History</span></div>
        <div style={{ fontSize:11, color:"#555" }}>{data.workouts.length} sessions</div>
      </div>
      <div style={{ marginTop:16 }}>
        {sorted.map(w => {
          const isOpen = expanded === w.id;
          const totalSets = w.exercises.reduce((n,e) => n + e.sets.filter(s => s.reps).length, 0);
          return (
            <div key={w.id} style={S.card}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", cursor:"pointer" }}
                onClick={() => setExpanded(isOpen ? null : w.id)}>
                <div>
                  <div style={{ fontWeight:700, color:"#fff", fontSize:14 }}>{fmtDate(w.date)}</div>
                  <div style={{ fontSize:12, color:"#555", marginTop:3 }}>
                    {w.planName && <span style={{ color:"#c8ff00" }}>{w.planName} · </span>}
                    {w.exercises.length} exercises · {totalSets} sets
                  </div>
                </div>
                <span style={{ color:"#c8ff00", fontSize:12, fontWeight:700, marginTop:2 }}>{isOpen?"▲":"▼"}</span>
              </div>
              {isOpen && (
                <div style={{ marginTop:12, borderTop:"1px solid #222", paddingTop:12 }}>
                  {w.exercises.map(ex => (
                    <div key={ex.id} style={{ marginBottom:12 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:"#ddd", marginBottom:4 }}>{ex.name}</div>
                      {ex.sets.filter(s => s.reps).map((s,i) => (
                        <div key={s.id} style={{ fontSize:12, color:"#666", marginLeft:12, marginBottom:2 }}>
                          Set {i+1}: {isBW(ex.name, data.customBW) ? `${s.reps} reps` : `${s.weight}kg × ${s.reps}`}
                        </div>
                      ))}
                    </div>
                  ))}
                  {w.note && (
                    <div style={{ fontSize:12, color:"#666", fontStyle:"italic", marginTop:8, borderTop:"1px solid #1e1e1e", paddingTop:8 }}>
                      "{w.note}"
                    </div>
                  )}
                  {deleting === w.id ? (
                    <div style={{ marginTop:12, display:"flex", gap:8, alignItems:"center" }}>
                      <span style={{ fontSize:12, color:"#ff3b30" }}>Delete this session?</span>
                      <button onClick={() => deleteWorkout(w.id)} style={{ ...S.btn("danger"), padding:"6px 12px", fontSize:12 }}>Yes</button>
                      <button onClick={() => setDeleting(null)} style={{ ...S.btn("ghost"), padding:"6px 12px", fontSize:12 }}>No</button>
                    </div>
                  ) : (
                    <button onClick={() => setDeleting(w.id)} style={{ ...S.btn("danger"), marginTop:12, fontSize:12, padding:"6px 12px" }}>
                      <Icon d={IC.trash} size={12} /> Delete
                    </button>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── PROGRESS VIEW ─────────────────────────────────────────────────────────────
function ProgressView({ data }) {
  const [selectedEx, setSelectedEx] = useState(null);
  const [metric, setMetric] = useState("weight");
  const exerciseNames = [...new Set(data.workouts.flatMap(w => w.exercises.map(e => e.name)))].sort();

  const getHistory = (name) => data.workouts
    .filter(w => w.exercises.some(e => e.name===name))
    .map(w => {
      const ex = w.exercises.find(e => e.name===name);
      const valid = ex.sets.filter(s => s.reps && Number(s.reps)>0);
      if (!valid.length) return null;
      return {
        date:w.date,
        maxReps:Math.max(...valid.map(s => Number(s.reps))),
        maxWeight:Math.max(...valid.map(s => Number(s.weight||0))),
        maxVol:Math.max(...valid.map(s => Number(s.weight||0)*Number(s.reps))),
        sets:valid.length,
      };
    }).filter(Boolean).sort((a,b) => a.date.localeCompare(b.date));

  const history = selectedEx ? getHistory(selectedEx) : [];
  const bw = selectedEx ? isBW(selectedEx, data.customBW) : false;
  const mKey = bw ? "maxReps" : metric==="reps"?"maxReps":metric==="vol"?"maxVol":"maxWeight";
  const mLabel = mKey==="maxReps"?"Max Reps":mKey==="maxVol"?"Max Volume (kg×reps)":"Max Weight (kg)";

  const renderChart = () => {
    if (history.length < 2) return <div style={{ color:"#555", textAlign:"center", padding:24, fontSize:13 }}>Need at least 2 sessions to chart</div>;
    const vals = history.map(h => h[mKey]);
    const max=Math.max(...vals), min=Math.min(...vals), range=max-min||1;
    const W=320,H=110,P=28;
    const x = i => P+(i/(history.length-1))*(W-P*2);
    const y = v => H-P-((v-min)/range)*(H-P*2);
    const pts = history.map((h,i) => `${x(i)},${y(h[mKey])}`).join(" ");
    return (
      <div style={{ overflowX:"auto" }}>
        <svg width={W} height={H} style={{ display:"block", margin:"0 auto" }}>
          <defs>
            <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#c8ff00" stopOpacity="0.25"/>
              <stop offset="100%" stopColor="#c8ff00" stopOpacity="0"/>
            </linearGradient>
          </defs>
          <polyline points={`${x(0)},${H-P} ${pts} ${x(history.length-1)},${H-P}`} fill="url(#g3)"/>
          <polyline points={pts} fill="none" stroke="#c8ff00" strokeWidth="2"/>
          {history.map((h,i) => <circle key={i} cx={x(i)} cy={y(h[mKey])} r="4" fill="#c8ff00"/>)}
          <text x={P} y={14} fill="#555" fontSize="10">{max}</text>
          <text x={P} y={H-P+14} fill="#555" fontSize="10">{min}</text>
        </svg>
        <div style={{ display:"flex", justifyContent:"space-between", padding:"0 28px", fontSize:10, color:"#444" }}>
          <span>{fmtDate(history[0].date)}</span><span>{fmtDate(history[history.length-1].date)}</span>
        </div>
      </div>
    );
  };

  return (
    <div style={{ paddingBottom:80 }}>
      <div style={S.header}>
        <div style={S.title}>Progress <span style={S.accent}>Charts</span></div>
      </div>
      {exerciseNames.length===0 ? (
        <div style={{ textAlign:"center", padding:"80px 32px", color:"#444" }}>
          <div style={{ fontSize:48, marginBottom:12 }}>📈</div>
          <div>Log some sessions to see progress</div>
        </div>
      ) : (
        <div style={{ marginTop:12 }}>
          <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:"1.5px", padding:"0 20px 8px" }}>Select Exercise</div>
          <div style={{ display:"flex", gap:8, overflowX:"auto", padding:"0 16px 16px" }}>
            {exerciseNames.map(name => (
              <button key={name} onClick={() => setSelectedEx(name)} style={S.tag(selectedEx===name)}>{name}</button>
            ))}
          </div>
          {selectedEx && (
            <div style={S.card}>
              <div style={{ fontWeight:700, fontSize:15, marginBottom:12, color:"#fff" }}>{selectedEx}</div>
              {!bw && (
                <div style={{ display:"flex", gap:8, marginBottom:16 }}>
                  {[["weight","Weight"],["reps","Reps"],["vol","Volume"]].map(([k,l]) => (
                    <button key={k} onClick={() => setMetric(k)} style={S.tag(metric===k)}>{l}</button>
                  ))}
                </div>
              )}
              <div style={{ fontSize:11, color:"#555", marginBottom:8, textTransform:"uppercase", letterSpacing:1 }}>{mLabel}</div>
              {renderChart()}
              <div style={{ marginTop:16, display:"flex", gap:16 }}>
                {[
                  { label:"Sessions", val:history.length },
                  { label:bw?"Best Reps":"Best Weight", val:bw?`${Math.max(...history.map(h=>h.maxReps))} reps`:`${Math.max(...history.map(h=>h.maxWeight))}kg` },
                  { label:"Total Sets", val:history.reduce((n,h)=>n+h.sets,0) },
                ].map(stat => (
                  <div key={stat.label} style={{ flex:1, textAlign:"center" }}>
                    <div style={{ fontSize:20, fontWeight:700, color:"#c8ff00" }}>{stat.val}</div>
                    <div style={{ fontSize:10, color:"#555", textTransform:"uppercase", letterSpacing:1 }}>{stat.label}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── ROOT ──────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("log");
  const [loading, setLoading] = useState(true);
  const [data, setData] = useState({ workouts:[], customExercises:[], customBW:[], plans:[], programs:[] });
  const [loadedPlan, setLoadedPlan] = useState(null);

  useEffect(() => {
    Promise.resolve(loadData()).then(saved => {
      if (saved) setData({ workouts:[], customExercises:[], customBW:[], plans:[], programs:[], ...saved });
      setLoading(false);
    });
  }, []);

  useEffect(() => {
    const link = document.createElement("link");
    link.href = "https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&display=swap";
    link.rel = "stylesheet";
    document.head.appendChild(link);
  }, []);

  const handleLoadPlan = (plan) => { setLoadedPlan(plan); setTab("log"); };

  if (loading) return (
    <div style={{ ...S.app, display:"flex", alignItems:"center", justifyContent:"center" }}>
      <div style={{ color:"#c8ff00", fontSize:14, letterSpacing:2 }}>LOADING...</div>
    </div>
  );

  const NAV = [
    { key:"log",      label:"Log",      icon:IC.dumbbell },
    { key:"plans",    label:"Plans",    icon:IC.plan     },
    { key:"history",  label:"History",  icon:IC.history  },
    { key:"progress", label:"Progress", icon:IC.chart    },
  ];

  return (
    <div style={S.app}>
      <div style={{ paddingBottom:80 }}>
        {tab==="log"      && <LogView data={data} setData={setData} loadedPlan={loadedPlan} clearLoadedPlan={() => setLoadedPlan(null)} />}
        {tab==="plans"    && <PlansView data={data} setData={setData} onLoadPlan={handleLoadPlan} />}
        {tab==="history"  && <HistoryView data={data} setData={setData} />}
        {tab==="progress" && <ProgressView data={data} />}
      </div>
      <nav style={S.nav}>
        {NAV.map(item => (
          <button key={item.key} onClick={() => setTab(item.key)} style={S.navBtn(tab===item.key)}>
            <Icon d={item.icon} size={20} />
            {item.label}
          </button>
        ))}
      </nav>
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .then(r => console.log("SW registered"))
          .catch(e => console.log("SW failed", e));
      });
    }
  </script>
</body>
